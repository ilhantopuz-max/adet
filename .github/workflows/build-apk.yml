name: Debug APK olustur
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Site adresin (ornek: https://siteadi.com/)'
        required: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android lisanslarini kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Site adresini ayarla
        env:
          APP_URL: ${{ inputs.app_url }}
        run: sed -i "s|https://ALANADIN.COM/|${APP_URL}|" app/src/main/res/values/strings.xml
      - name: APK derle
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: duygunun-halleri-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
